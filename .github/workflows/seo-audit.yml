name: SEO and GEO baseline
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/check-seo.mjs'
      - '.github/workflows/seo-audit.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/check-seo.mjs'
      - '.github/workflows/seo-audit.yml'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate site discoverability metadata
        run: node scripts/check-seo.mjs
      - name: Verify live routes and canonicals weekly
        if: github.event_name == 'schedule'
        run: node scripts/check-seo.mjs --live
